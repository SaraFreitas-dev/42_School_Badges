    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#7a5418"/><stop offset="1" stop-color="#d9a441"/>
