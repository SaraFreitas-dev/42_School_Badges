<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C792EA"/><stop offset=".5" stop-color="#3a2a55"/><stop offset="1" stop-color="#6b3fa0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#C792EA" stop-opacity=".22"/><stop offset="1" stop-color="#C792EA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="in"><polygon points="200.0,32.0 336.8,111.0 336.8,269.0 200.0,348.0 63.2,269.0 63.2,111.0"/></clipPath>
    <style>
      .st{fill:#cfd3ff;opacity:.3;animation:tw 4s ease-in-out infinite}
      @keyframes tw{50%{opacity:.9}}
      .cur{animation:bl 1.1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
      .mono{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
    </style>
  </defs>

  <!-- moldura -->
  <polygon points="200.0,18.0 349.0,104.0 349.0,276.0 200.0,362.0 51.0,276.0 51.0,104.0" fill="url(#rim)" stroke-linejoin="round"/>
  <polygon points="200.0,30.0 338.6,110.0 338.6,270.0 200.0,350.0 61.4,270.0 61.4,110.0" fill="#0b0c12"/>

  <!-- cena interior -->
  

  <!-- emblema -->
  <g transform="translate(196,182) scale(1.18)"><rect x="-78" y="-52" width="22" height="92" rx="3" fill="#232738" stroke="#8b90a8" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-73" y1="-38" x2="-61" y2="-38" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <line x1="-73" y1="30" x2="-61" y2="30" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <rect x="-52" y="-64" width="20" height="104" rx="3" fill="#1c2030" stroke="#8b90a8" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-47" y1="-50" x2="-37" y2="-50" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <line x1="-47" y1="30" x2="-37" y2="30" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <rect x="-28" y="-44" width="26" height="84" rx="3" fill="#6b3fa0" stroke="#8b90a8" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-23" y1="-30" x2="-7" y2="-30" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <line x1="-23" y1="30" x2="-7" y2="30" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <rect x="2" y="-58" width="20" height="98" rx="3" fill="#232738" stroke="#8b90a8" stroke-width="3" stroke-linejoin="round"/>
    <line x1="7" y1="-44" x2="17" y2="-44" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <line x1="7" y1="30" x2="17" y2="30" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <rect x="26" y="-68" width="22" height="108" rx="3" fill="#1c2030" stroke="#8b90a8" stroke-width="3" stroke-linejoin="round"/>
    <line x1="31" y1="-54" x2="43" y2="-54" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <line x1="31" y1="30" x2="43" y2="30" stroke="#8b90a8" stroke-width="2" opacity=".6"/>
    <g transform="translate(54,40) rotate(14)"><rect x="-2" y="-96" width="24" height="96" rx="3" fill="#2a1f40" stroke="#C792EA" stroke-width="3"/><text class="mono" x="10" y="-40" text-anchor="middle" font-size="13" font-weight="700" fill="#C792EA" transform="rotate(-90 10 -40)">ft_</text></g>
    <rect x="-92" y="40" width="190" height="9" rx="3" fill="#8b90a8"/>
    <text class="mono" x="-15" y="-10" text-anchor="middle" font-size="15" font-weight="700" fill="#e6e8f2">.a</text></g>

  <!-- marcador do milestone -->
  <g transform="translate(200,30)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#0b0c12" stroke="#C792EA" stroke-width="2"/>
    <text class="mono" x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#C792EA">M0</text>
  </g>

  <!-- fita com o nome -->
  <g transform="translate(200,330)">
    <rect x="-130" y="-26" width="260" height="52" rx="12" fill="#0b0c12" stroke="url(#rim)" stroke-width="3"/>
    <text class="mono" x="0" y="10" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8f2"><tspan fill="#C792EA">./</tspan>libft<tspan class="cur" fill="#C792EA">_</tspan></text>
  </g>
</svg>