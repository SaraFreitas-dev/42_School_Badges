<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#7a5418"/><stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#C792EA" stop-opacity=".22"/><stop offset="1" stop-color="#C792EA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="in"><polygon points="200.0,32.0 336.8,111.0 336.8,269.0 200.0,348.0 63.2,269.0 63.2,111.0"/></clipPath>
    <style>
      .st{fill:#cfd3ff;opacity:.3;animation:tw 4s ease-in-out infinite}
      @keyframes tw{50%{opacity:.9}}
      .cur{animation:bl 1.1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
      .sw{animation:sw 3s ease-in-out infinite;transform-box:view-box}
      @keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      .bob{animation:bob 2.4s ease-in-out infinite} @keyframes bob{50%{transform:translateY(3px)}}
      .mono{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
    </style>
  </defs>

  <!-- moldura -->
  <polygon points="200.0,18.0 349.0,104.0 349.0,276.0 200.0,362.0 51.0,276.0 51.0,104.0" fill="url(#rim)" stroke-linejoin="round"/>
  <polygon points="200.0,30.0 338.6,110.0 338.6,270.0 200.0,350.0 61.4,270.0 61.4,110.0" fill="#0b0c12"/>

  <!-- cena interior -->
  <g clip-path="url(#in)">
    <rect width="400" height="400" fill="url(#sky)"/>
    <circle cx="200" cy="175" r="120" fill="url(#glow)"/>
    <circle class="st" style="animation-delay:0.7s" cx="238" cy="159" r="0.8"/><circle class="st" style="animation-delay:0.3s" cx="128" cy="116" r="1"/><circle class="st" style="animation-delay:2.6s" cx="255" cy="81" r="0.8"/><circle class="st" style="animation-delay:2.6s" cx="139" cy="152" r="1"/><circle class="st" style="animation-delay:1.8s" cx="155" cy="178" r="1"/><circle class="st" style="animation-delay:0.2s" cx="196" cy="158" r="1"/><circle class="st" style="animation-delay:3.2s" cx="235" cy="186" r="1.3"/><circle class="st" style="animation-delay:0.1s" cx="296" cy="157" r="1"/><circle class="st" style="animation-delay:4.0s" cx="104" cy="94" r="1"/><circle class="st" style="animation-delay:3.6s" cx="301" cy="116" r="1.3"/><circle class="st" style="animation-delay:1.8s" cx="107" cy="108" r="1.3"/><circle class="st" style="animation-delay:3.1s" cx="301" cy="151" r="0.8"/><circle class="st" style="animation-delay:1.0s" cx="178" cy="137" r="0.8"/><circle class="st" style="animation-delay:3.2s" cx="281" cy="126" r="0.8"/><circle class="st" style="animation-delay:0.4s" cx="304" cy="126" r="1"/><circle class="st" style="animation-delay:2.6s" cx="215" cy="182" r="1.3"/>
