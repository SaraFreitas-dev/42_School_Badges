<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C792EA"/><stop offset=".5" stop-color="#3a2a55"/><stop offset="1" stop-color="#6b3fa0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#C792EA" stop-opacity=".22"/><stop offset="1" stop-color="#C792EA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="in"><polygon points="200.0,32.0 336.8,111.0 336.8,269.0 200.0,348.0 63.2,269.0 63.2,111.0"/></clipPath>
    <style>
      .st{fill:#cfd3ff;opacity:.3;animation:tw 4s ease-in-out infinite}
      @keyframes tw{50%{opacity:.9}}
      .cur{animation:bl 1.1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
      .sw{animation:sw 3s ease-in-out infinite;transform-box:view-box}
      @keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      .bob{animation:bob 2.4s ease-in-out infinite} @keyframes bob{50%{transform:translateY(3px)}}
      .mono{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
    </style>
  </defs>

  <!-- moldura -->
  <polygon points="200.0,18.0 349.0,104.0 349.0,276.0 200.0,362.0 51.0,276.0 51.0,104.0" fill="url(#rim)" stroke-linejoin="round"/>
  <polygon points="200.0,30.0 338.6,110.0 338.6,270.0 200.0,350.0 61.4,270.0 61.4,110.0" fill="#0b0c12"/>

  <!-- cena interior -->
  <g clip-path="url(#in)">
    <rect width="400" height="400" fill="url(#sky)"/>
    <circle cx="200" cy="175" r="120" fill="url(#glow)"/>
    <circle class="st" style="animation-delay:2.1s" cx="91" cy="106" r="1"/><circle class="st" style="animation-delay:2.0s" cx="289" cy="180" r="1.3"/><circle class="st" style="animation-delay:2.4s" cx="116" cy="122" r="1.3"/><circle class="st" style="animation-delay:1.3s" cx="230" cy="99" r="1"/><circle class="st" style="animation-delay:1.2s" cx="182" cy="109" r="1"/><circle class="st" style="animation-delay:1.8s" cx="141" cy="169" r="1.3"/><circle class="st" style="animation-delay:3.3s" cx="124" cy="164" r="1.3"/><circle class="st" style="animation-delay:1.6s" cx="114" cy="117" r="0.8"/><circle class="st" style="animation-delay:2.6s" cx="284" cy="137" r="0.8"/><circle class="st" style="animation-delay:3.0s" cx="270" cy="82" r="1.3"/><circle class="st" style="animation-delay:0.7s" cx="310" cy="185" r="0.8"/><circle class="st" style="animation-delay:0.5s" cx="246" cy="156" r="1.3"/><circle class="st" style="animation-delay:3.1s" cx="187" cy="156" r="1.3"/><circle class="st" style="animation-delay:1.8s" cx="107" cy="127" r="0.8"/><circle class="st" style="animation-delay:3.4s" cx="295" cy="118" r="1.3"/><circle class="st" style="animation-delay:2.6s" cx="234" cy="87" r="1"/>
